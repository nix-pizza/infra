name: "Rekey secrets"
on:
  push:
    branches:
      - merge-nix-milano
jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
    - run: |
        mkdir -p /home/runner/.ssh
        echo "${{ secrets.SSH_KEY }}" > /home/runner/.ssh/id_ed25519
        chmod 600 /home/runner/.ssh/id_ed25519
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Re-encrypt every secret readable by the CI key to the recipients in secrets.nix
      run: |
        cat > /tmp/rekey.sh <<'EOF'
        set -euo pipefail
        ci_key="$(nix eval --raw --impure --expr '(import ./keys).infra.sshKeys.github.key')"
        nix eval --json --file secrets/secrets.nix \
          | jq -r --arg k "$ci_key" 'to_entries[] | select(.value.publicKeys | index($k)) | [.key] + .value.publicKeys | @tsv' \
          | while IFS=$'\t' read -r -a fields; do
              file="secrets/${fields[0]}"
              args=()
              for r in "${fields[@]:1}"; do args+=(-r "$r"); done
              echo "rekeying $file for $(( ${#fields[@]} - 1 )) recipients"
              age -d -i ~/.ssh/id_ed25519 "$file" | age -e "${args[@]}" -o "$file.new"
              mv "$file.new" "$file"
            done
        EOF
        nix shell nixpkgs#age nixpkgs#jq -c bash /tmp/rekey.sh
    - uses: actions/upload-artifact@v4
      with:
        name: secrets
        path: secrets/*.age
